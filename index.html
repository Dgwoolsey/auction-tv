<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Woolsey Auction Company</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="screen" class="screen">

  <header class="topbar">
    <div class="brand">
      <div class="brand-name">WOOLSEY AUCTION COMPANY</div>
      <div class="brand-sub" id="headline">Thanks for bidding with us</div>
    </div>
    <div class="clock">
      <div class="clock-time" id="clockTime">&nbsp;</div>
      <div class="clock-date" id="clockDate">&nbsp;</div>
    </div>
  </header>

  <main class="stage">

    <!-- LEFT RAIL: both review codes, corner to corner -->
    <aside class="rail">
      <div class="qr-card qr-google">
        <div class="qr-box" id="qrGoogle"></div>
        <div class="qr-label">Review us on Google</div>
        <div class="qr-sub">Scan with your phone camera</div>
      </div>
      <div class="qr-card qr-facebook">
        <div class="qr-box" id="qrFacebook"></div>
        <div class="qr-label">Review us on Facebook</div>
        <div class="qr-sub">Scan with your phone camera</div>
      </div>
    </aside>

    <!-- CENTRE: photos on top, good-to-know beneath -->
    <section class="centre">

      <div class="photo-frame">
        <img class="photo-img" id="photoA" alt="">
        <img class="photo-img" id="photoB" alt="">
        <div class="photo-empty" id="photoEmpty">
          <div class="photo-empty-mark">W</div>
          <div class="photo-empty-text">Auction photos load here</div>
        </div>
      </div>

      <div class="photo-caption" id="photoCaption"></div>

      <!-- One auction at a time, cycling through every live sale. -->
      <div class="auction-card" id="auctionCard">
        <div class="auction-head">
          <div class="auction-title" id="auctionTitle"></div>
          <div class="auction-countdown" id="auctionCountdown"></div>
        </div>
        <div class="auction-facts">
          <div class="fact">
            <div class="fact-label">Closes</div>
            <div class="fact-value" id="auctionCloses"></div>
          </div>
          <div class="fact">
            <div class="fact-label">Pickup</div>
            <div class="fact-value" id="auctionPickup"></div>
          </div>
          <div class="fact">
            <div class="fact-label">Lots</div>
            <div class="fact-value" id="auctionLots"></div>
          </div>
        </div>
        <div class="auction-dots" id="auctionDots"></div>
      </div>

      <div class="terms-card" id="termsCard">
        <div class="terms-eyebrow">GOOD TO KNOW</div>
        <div class="terms-title" id="termsTitle">&nbsp;</div>
        <div class="terms-body" id="termsBody">&nbsp;</div>
        <div class="terms-dots" id="termsDots"></div>
      </div>

    </section>

    <!-- RIGHT RAIL: consign + terms, corner to corner -->
    <aside class="rail">
      <div class="qr-card qr-consign">
        <div class="qr-box" id="qrConsign"></div>
        <div class="qr-label">Sell With Us</div>
        <div class="qr-sub">We'll call you back</div>
      </div>
      <div class="qr-card qr-bid">
        <div class="qr-box" id="qrBid"></div>
        <div class="qr-label">Bid Online</div>
        <div class="qr-sub">Scan to see every auction</div>
      </div>
    </aside>

  </main>

  <footer class="ticker">
    <div class="ticker-track" id="tickerTrack"></div>
  </footer>

  <div class="status" id="status"></div>

</div>

<script src="app.js"></script>
</body>
</html>
